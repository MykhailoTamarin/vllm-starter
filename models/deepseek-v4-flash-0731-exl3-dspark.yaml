# ── DeepSeek V4 Flash Spark (EXL3 3.0bpw, REAP K216) — DSPark compact draft ──
# REAP K216-pruned MoE (EXL3 3.0bpw) of deepseek-ai/DeepSeek-V4-Flash-0731
# 43 layers, 216 experts/layer, on-disk 99.48 GiB (EXL3 Trellis K3)
# TP4 rank-sliced weights (TP1 coalesced by EXL3 backend at load time)
# SparkInfer Trellis MoE + FLASHINFER_MLA attention + FP8 KV cache
#
# DSPark speculative decoding (native v0.26.0) with a COMPACT K160 draft:
#   --speculative-config '{"method":"dspark","model":"<draft-dir>","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}'
# K160 = acceptance-rate sweep sweet spot (2026-08-22, see
# models/benchmarks/<model>/draft-acceptance-sweep-2026-08-22/):
# coding 45.3% / 39.3 t/s, text 39.7% / 35.0 t/s, chat 35.0% / 31.9 t/s;
# K192 only wins on chat (39.5%) at higher draft cost.
# The draft is built once at startup by /opt/recipe/serve_ds4_exl3.sh from the
# checkpoint's REAP_K216_PLAN.json (DSPARK_DRAFT_EXPERTS experts, 32 structured
# per category), into DRAFT_DIR.  The target keeps all 216 experts.  Drafting
# fewer experts than the full 216 frees unified memory for context/KV capacity.
# Note: num_speculative_tokens must be >= dspark_block_size (5). K5 is the
# REAP/0xSero validated recipe ("fixed K5 DSpark verification with a six-row
# C1 graph"); the base DeepSeek-V4-Flash-0731 card runs 7+greedy, but that is
# the unquantized GB300/mega-moe recipe, not this EXL3/REAP stack.
#
# The draft builder (build_dspark_draft.py) is mounted read-only from
# models/files/ (NOT baked into the image) so draft experiments (any K)
# only require editing DSPARK_DRAFT_EXPERTS + DRAFT_DIR + the speculative-config
# model path, then a restart — no image rebuild.
#
# To use the EMBEDDED full 216-expert MTP draft instead (no compact build, all
# experts): switch command to 'exec vllm serve', drop DRAFT_DIR +
# DSPARK_DRAFT_EXPERTS env, and omit 'model' from speculative-config.
#
#
# Custom image vllm-exl3-v26:latest built from:
#   base: vllm/vllm-openai:v0.26.0 (native DSPark, DeepSeek V4, EPLB, Eagle3)
#   sparkinfer: brandonmmusic-max/b12x@669a12dd (exl3-trellis-fused)
#   exllamav3 v1.4.1 (cloned at build + ARM64 patches, Ubuntu 22.04)
#   instanttensor 0.1.5 (fast mmap weight loading, --load-format instanttensor)
#   vLLM EXL3 backend overlay (exl3.py quantization + model deltas)
#   DSv4 attention hotfix backports #49486/#50298/#50365 (patch_attn_*.py)
#
# Container: vllm-deepseek-v4-flash-0731-spark
# API:       http://localhost:8000/v1/chat/completions
# HF:        https://huggingface.co/0xSero/deepseek-v4-flash-0731-spark
# Base:      https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731
# Port:      8000
#
# ────────────────────────────────────────────────────────────────────────────

image: ghcr.io/mykhailotamarin/vllm-starter:vllm-0_26_0-exl3-0.1.10
command: 'exec /opt/recipe/serve_ds4_exl3.sh'

volumes:
  - ${HOME}/vllm-starters/models/files/REAP_K216_PLAN.json:/opt/recipe/REAP_K216_PLAN.json:ro
  - ${HOME}/vllm-starters/models/files/build_dspark_draft.py:/opt/recipe/build_dspark_draft.py:ro

env:
  CUDA_DEVICE_ORDER=PCI_BUS_ID
  CUDA_VISIBLE_DEVICES=0
  CUTE_DSL_ARCH=sm_121a
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  INSTANTTENSOR_BACKEND=BUFFERED
  VLLM_USE_BREAKABLE_CUDAGRAPH=0
  VLLM_EXL3_TRELLIS_MIN_M=1
  VLLM_EXL3_TRELLIS_MAX_M=32
  VLLM_EXL3_PREFILL_TRELLIS=1
  VLLM_EXL3_EXT_PATH=/usr/local/lib/python3.12/dist-packages
  LD_LIBRARY_PATH=/usr/local/lib/python3.12/dist-packages/torch/lib:${LD_LIBRARY_PATH}
  MODEL_REPO=0xSero/deepseek-v4-flash-0731-spark
  DRAFT_DIR=/opt/dspark-drafts/deepseek-v4-flash-0731-spark/dspark-draft-k160
  DSPARK_DRAFT_EXPERTS=160
  DSPARK_STRUCTURED_EXPERTS_PER_CATEGORY=32

args:
  --model 0xSero/deepseek-v4-flash-0731-spark
  --served-model-name deepseek-v4-flash-0731
  --port 8000
  --tensor-parallel-size 1
  --pipeline-parallel-size 1
  --decode-context-parallel-size 1
  --no-enable-expert-parallel
  --moe-backend auto
  --quantization exl3
  --load-format instanttensor
  --attention-backend FLASHINFER_MLA
  --kv-cache-dtype fp8
  --block-size 256
  --gpu-memory-utilization 0.90
  --max-model-len 524288
  --max-num-seqs 2
  --max-num-batched-tokens 2048
  --cudagraph-capture-sizes 1 2 4 8 16
  --speculative-config '{"method":"dspark","model":"/opt/dspark-drafts/deepseek-v4-flash-0731-spark/dspark-draft-k160","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}'
  --enable-chunked-prefill
  --async-scheduling
  --enable-prefix-caching
  --tokenizer-mode deepseek_v4
  --tool-call-parser deepseek_v4
  --reasoning-parser deepseek_v4
  --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<thinking>","reasoning_end_str":"</thinking>"}'
  --default-chat-template-kwargs '{"thinking":true}'
  --enable-auto-tool-choice
  --disable-access-log-for-endpoints /health,/metrics,/ping