# ── DeepSeek V4 Flash Spark (REAP 180B, NVFP4) — DSpark MTP ──────────────
# REAP K160-pruned MoE (180B total) of deepseek-ai/DeepSeek-V4-Flash-0731
# 43 layers, 160 experts/layer, hidden 4096, on-disk 100 GiB (NVFP4/MXFP4)
# 3-token DSpark MTP speculative decoding (model-native blocks in layers 40-42)
# b12x MoE backend, fp8_ds_mla KV cache, breakable CUDA graphs
#
# Recommended for: single DGX Spark inference with DSpark speculative decoding
#
# Uses vllm/vllm-openai:v0.26.0 with runtime DSpark overlay + REAP K160 patches
#
# Container: vllm-deepseek-v4-flash-0731-dspark
# API:       http://localhost:8000/v1/chat/completions
# HF:        https://huggingface.co/0xSero/DeepSeek-V4-Flash-0731-REAP
# Base:      https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash-0731
# Image:     vllm/vllm-openai:v0.26.0
# REAP:      https://arxiv.org/abs/2510.13999
# Port:      8000
#
# ─────────────────────────────────────────────────────────────────────────────

image: vllm/vllm-openai:v0.26.0

command: 'python3 /patch/patch_vllm_k160_dspark.py && exec vllm serve'

volumes:
  - $PROJECT_DIR/models/files:/patch:ro

env:
  VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE=600
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  VLLM_USE_FLASHINFER_SAMPLER=1
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0
  TILELANG_CLEANUP_TEMP_FILES=1

args:
  --model 0xSero/DeepSeek-V4-Flash-0731-REAP
  --served-model-name deepseek-v4-flash
  --port 8000
  --trust-remote-code
  --tensor-parallel-size 1
  --pipeline-parallel-size 1
  --kv-cache-dtype nvfp4_ds_mla
  --block-size 256
  --max-model-len 262144
  --max-num-seqs 1
  --max-num-batched-tokens 4096
  --gpu-memory-utilization 0.9
  --distributed-executor-backend mp
  --tokenizer-mode deepseek_v4
  --load-format safetensors
  --enable-chunked-prefill
  --async-scheduling
  --enable-prefix-caching
  --tool-call-parser deepseek_v4
  --enable-auto-tool-choice
  --reasoning-parser deepseek_v4
  --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<thinking>","reasoning_end_str":"</thinking>"}'
  --default-chat-template-kwargs '{"thinking":true}'
  --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}'
  --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"greedy"}'
  --generation-config vllm
  --enable-flashinfer-autotune
  --disable-access-log-for-endpoints /health,/metrics,/ping
